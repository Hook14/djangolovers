{% load static %} <!-- загружаем статические файлы -->
<!DOCTYPE html>
<html>
    <head> <!-- содержит информацию о документе, которая не отображается на экране. -->
        <title>Newbee's blog</title> <!-- заголовок страницы -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lobster&subset=latin,latin-ext">
        <link rel="stylesheet" href="{% static 'css/blog.css' %}">g
    </head>
    <body> <!-- содержит всё остальное, что отображается на веб-странице -->
        <header class="page-header"> <!-- указывает заголовок для документа или раздела. -->
          <div class="container">
              <!-- Мы добавим if к этому элементу ещё один тег, благодаря которому ссылка будет отображаться только
               для пользователей, вошедших в административную панель.(Для безопасности и персонализации. Это if - gприведет к тому,
               что ссылка будет отправлена в браузер только в том случае, если пользователь, запрашивающий страницу, авторизован. -->
              {% if user.is_authenticated %}
                  <a href="{% url 'post_new' %}" class="top-menu">
                      {% include './icons/file-earmark-plus.svg' %} <!-- значки, которые будут использоваться в
                                                                    качестве кнопок для этой ссылки -->
                  </a>
              {% endif %}
              <h1><a href="/">Newbee's Blog</a></h1>
          </div>
        </header>
        <main class="container">
            <div class="row">
                <div class="col">
                {% block content %}
                {% endblock %}
                </div>
            </div>
        </main>
    </body>
</html>
